services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brainledge
      POSTGRES_PASSWORD: brainledge
      POSTGRES_DB: brainledge
    ports:
      - 5432:5432
  app:
    build: .
    command:
      - node
      - packages/server/dist/main.js
      - api
    environment:
      APP_PROFILE: standalone
      BRAINLEDGE_DATA_DIR: /data
      BRAINLEDGE_HOST: 0.0.0.0
      BRAINLEDGE_UNSAFE_BIND: '1'
      BRAINLEDGE_API_TOKEN: compose-dev-token
    volumes:
      - brainledge-data:/data
    ports:
      - 8787:8787
    depends_on:
      - postgres
  worker:
    build: .
    command:
      - node
      - packages/server/dist/main.js
      - worker
    environment:
      APP_PROFILE: standalone
      BRAINLEDGE_DATA_DIR: /data
    volumes:
      - brainledge-data:/data
    depends_on:
      - postgres
  oidc:
    image: postgres:16-alpine
    profiles:
      - auth
    command:
      - postgres
      - --version
  minio:
    image: minio/minio:latest
    profiles:
      - object-storage
    command:
      - server
      - /data

volumes:
  brainledge-data:
